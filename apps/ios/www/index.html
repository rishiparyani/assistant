<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Assistant</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      button {
        font: inherit;
        padding: 12px 20px;
        border-radius: 12px;
        border: 0;
        background: #0a84ff;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach Assistant</h1>
      <p>
        Connect to the internet once so the app can save itself on this phone. After that it opens offline
        too.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
