<!doctype html>
<!-- The site's page (decision 2026-10-22 "The website is the app"): Expo fills in the title and
     the script. The icons and manifest are the site's (apps/web/public), served from the root. -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ede6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c070f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gigspree" />
    <meta name="description" content="Your lists, people and money, kept and done for you." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #ede6f2;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Shown until the app starts, so a slow connection never looks like a blank page. */
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font:
          500 15px/1.4 system-ui,
          -apple-system,
          sans-serif;
        color: #6b5c74;
        background: #ede6f2;
      }
      .splash-mark {
        width: 64px;
        height: 64px;
        background: url("/logo-light.png") center / contain no-repeat;
      }
      .splash-spin {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6e2e91;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0c070f;
        }
        .splash {
          background: #0c070f;
          color: #b3a3bd;
        }
        .splash-mark {
          background-image: url("/logo-dark.png");
        }
      }
    </style>
  </head>
  <body>
    <noscript>Gigspree needs JavaScript turned on.</noscript>
    <div id="root">
      <div class="splash" role="status" aria-live="polite">
        <span class="splash-mark" aria-hidden="true"></span>
        <span class="splash-spin" aria-hidden="true"></span>
        <span>Loading…</span>
      </div>
    </div>
  </body>
</html>
