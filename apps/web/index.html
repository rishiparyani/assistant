<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c10" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gigspree" />
    <meta name="description" content="Gigs, clients, payments and collective shares in one place." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Gigspree</title>
    <style>
      /* Shown until the app starts, so a slow connection never looks like a blank page. */
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font:
          500 15px/1.4 system-ui,
          -apple-system,
          sans-serif;
        color: #6b6b76;
        background: #f4f4f6;
      }
      .splash-mark {
        width: 64px;
        height: 64px;
        background: url("/logo-light.png") center / contain no-repeat;
      }
      .splash-spin {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2.5px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6366f1;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        .splash {
          background: #0c0c10;
          color: #a1a1ab;
        }
        .splash-mark {
          background-image: url("/logo-dark.png");
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="splash" role="status" aria-live="polite">
        <span class="splash-mark" aria-hidden="true"></span>
        <span class="splash-spin" aria-hidden="true"></span>
        <span>Loading…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
