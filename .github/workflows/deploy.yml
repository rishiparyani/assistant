# Deploys the app: push to `main` → prod (`assistant`), push to any other branch → dev
# (`assistant-dev`). Public repo rules (docs/security.md): push-only trigger,
# minimal permissions, actions pinned to SHAs, never print secrets or data.
name: Deploy

on:
  push:
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "spikes/**"
      - "shortcuts/**"
      - "**/*.md"
      - ".github/workflows/spike-*.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub Environments: restrict `production` to the main branch in repo settings.
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'dev' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Selects the wrangler environment at build time (empty = top-level = dev).
      CLOUDFLARE_ENV: ${{ github.ref_name == 'main' && 'production' || '' }}
      DB_NAME: ${{ github.ref_name == 'main' && 'assistant' || 'assistant-dev' }}
      # Placeholder database_id in apps/worker/wrangler.jsonc for this environment.
      DB_PLACEHOLDER: ${{ github.ref_name == 'main' && '00000000-0000-0000-0000-000000000001' || '00000000-0000-0000-0000-000000000000' }}
      APP_URL: ${{ github.ref_name == 'main' && 'https://assistant.rishiparyani.workers.dev' || 'https://assistant-dev.rishiparyani.workers.dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Ensure D1 database exists
        working-directory: apps/worker
        run: |
          db_id() { pnpm exec wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid'; }
          id="$(db_id)"
          if [ -z "$id" ]; then
            pnpm exec wrangler d1 create "$DB_NAME" > /dev/null
            id="$(db_id)"
          fi
          test -n "$id"
          # Not secret; filled in here so the repo needs no per-account edits.
          sed -i "s/$DB_PLACEHOLDER/$id/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc

      - name: Build
        run: pnpm build

      - name: Apply migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote ${CLOUDFLARE_ENV:+--env "$CLOUDFLARE_ENV"}

      - name: Deploy
        working-directory: apps/web
        run: pnpm exec wrangler deploy

      # Run from apps/web so wrangler targets the Worker just built (dev or prod).
      - name: Set Worker secrets
        working-directory: apps/web
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          existing="$(pnpm exec wrangler secret list 2>/dev/null || true)"
          printf '%s' "$GOOGLE_CLIENT_ID" | pnpm exec wrangler secret put GOOGLE_CLIENT_ID > /dev/null
          printf '%s' "$GOOGLE_CLIENT_SECRET" | pnpm exec wrangler secret put GOOGLE_CLIENT_SECRET > /dev/null
          # Generated once per Worker, never printed or stored in GitHub (docs/setup.md).
          if ! printf '%s' "$existing" | grep -q 'BETTER_AUTH_SECRET'; then
            openssl rand -base64 32 | tr -d '\n' | pnpm exec wrangler secret put BETTER_AUTH_SECRET > /dev/null
            echo "Generated BETTER_AUTH_SECRET."
          fi
          echo "Secrets set."

      - name: Smoke test
        run: |
          # The new version can take a few seconds to reach every edge: retry until the
          # health check passes (up to ~90 s), then check the web app is served.
          for i in $(seq 1 18); do
            body="$(curl -fsS "$APP_URL/api/health" || true)"
            if printf '%s' "$body" | jq -e --argjson m "$(ls apps/worker/migrations/*.sql | wc -l)" '.ok == true and .migrations == $m and (.modules | length) >= 1' > /dev/null 2>&1; then
              echo "$body"
              break
            fi
            if [ "$i" = 18 ]; then echo "Health check never passed. Last response: $body"; exit 1; fi
            sleep 5
          done
          curl -fsS "$APP_URL/" | grep -q '<div id="app">'
          # Auth is configured: session endpoint answers, OAuth discovery is served.
          curl -fsS "$APP_URL/auth/get-session" > /dev/null
          curl -fsS "$APP_URL/.well-known/oauth-authorization-server" | jq -e '.issuer | endswith("/auth")' > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/me")" = "401"
          echo "App and API are up at $APP_URL"
