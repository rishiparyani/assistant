# Deploys the app: push to `main` → prod (`assistant`), push to any other branch → dev
# (`assistant-dev`). Public repo rules (docs/security.md): push-only trigger,
# minimal permissions, actions pinned to SHAs, never print secrets or data.
name: Deploy

on:
  push:
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "spikes/**"
      - "shortcuts/**"
      - "**/*.md"
      - ".github/workflows/spike-*.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # GitHub Environments: restrict `production` to the main branch in repo settings.
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    concurrency:
      group: deploy-${{ github.ref_name == 'main' && 'production' || 'dev' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Selects the wrangler environment at build time (empty = top-level = dev).
      CLOUDFLARE_ENV: ${{ github.ref_name == 'main' && 'production' || '' }}
      DB_NAME: ${{ github.ref_name == 'main' && 'assistant' || 'assistant-dev' }}
      WORKER_NAME: ${{ github.ref_name == 'main' && 'assistant' || 'assistant-dev' }}
      # Summaries queue for gig-centric storage (docs/design/gig-centric.md); its dead letter
      # queue is "<name>-dlq". Must match apps/worker/wrangler.jsonc.
      QUEUE_NAME: ${{ github.ref_name == 'main' && 'summaries' || 'summaries-dev' }}
      # Placeholder database_id in apps/worker/wrangler.jsonc for this environment.
      DB_PLACEHOLDER: ${{ github.ref_name == 'main' && '00000000-0000-0000-0000-000000000001' || '00000000-0000-0000-0000-000000000000' }}
      APP_URL: ${{ github.ref_name == 'main' && 'https://gigspree.in' || 'https://dev.gigspree.in' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Ensure D1 database exists
        working-directory: apps/worker
        run: |
          db_id() { pnpm exec wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid'; }
          id="$(db_id)"
          if [ -z "$id" ]; then
            pnpm exec wrangler d1 create "$DB_NAME" > /dev/null
            id="$(db_id)"
          fi
          test -n "$id"
          # Not secret; filled in here so the repo needs no per-account edits.
          sed -i "s/$DB_PLACEHOLDER/$id/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc

      - name: Ensure queues exist
        working-directory: apps/worker
        run: |
          for q in "$QUEUE_NAME" "$QUEUE_NAME-dlq"; do
            if ! pnpm exec wrangler queues info "$q" > /dev/null 2>&1; then
              if ! pnpm exec wrangler queues create "$q" > /dev/null; then
                echo "::error::Couldn't create queue $q. The Cloudflare API token needs Account → Queues: Edit (docs/setup.md)."
                exit 1
              fi
            fi
          done

      - name: Build
        run: pnpm build

      - name: Apply migrations
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply "$DB_NAME" --remote ${CLOUDFLARE_ENV:+--env "$CLOUDFLARE_ENV"}

      - name: Deploy
        working-directory: apps/web
        run: pnpm exec wrangler deploy

      # `wrangler secret` doesn't follow the Vite build's config, so name the Worker.
      - name: Set Worker secrets
        working-directory: apps/worker
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Admin panel owners (docs/design/gig-centric.md §10b); optional.
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          # Admin panel per-action numbers (read-only analytics token); optional.
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Alerts to the owner's Telegram bot; optional.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Fail if listing fails: guessing would regenerate the secret and sign everyone out.
          existing="$(pnpm exec wrangler secret list --name "$WORKER_NAME")"
          printf '%s' "$GOOGLE_CLIENT_ID" | pnpm exec wrangler secret put GOOGLE_CLIENT_ID --name "$WORKER_NAME" > /dev/null
          printf '%s' "$GOOGLE_CLIENT_SECRET" | pnpm exec wrangler secret put GOOGLE_CLIENT_SECRET --name "$WORKER_NAME" > /dev/null
          if [ -n "$ADMIN_EMAILS" ]; then
            printf '%s' "$ADMIN_EMAILS" | pnpm exec wrangler secret put ADMIN_EMAILS --name "$WORKER_NAME" > /dev/null
          fi
          if [ -n "$ANALYTICS_TOKEN" ]; then
            printf '%s' "$ANALYTICS_TOKEN" | pnpm exec wrangler secret put ANALYTICS_TOKEN --name "$WORKER_NAME" > /dev/null
            printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | pnpm exec wrangler secret put CLOUDFLARE_ACCOUNT_ID --name "$WORKER_NAME" > /dev/null
          fi
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | pnpm exec wrangler secret put TELEGRAM_BOT_TOKEN --name "$WORKER_NAME" > /dev/null
          fi
          # Generated once per Worker, never printed or stored in GitHub (docs/setup.md).
          if ! printf '%s' "$existing" | grep -q 'BETTER_AUTH_SECRET'; then
            openssl rand -base64 32 | tr -d '\n' | pnpm exec wrangler secret put BETTER_AUTH_SECRET --name "$WORKER_NAME" > /dev/null
            echo "Generated BETTER_AUTH_SECRET."
          fi
          echo "Secrets set."

      - name: Smoke test
        run: |
          # Right after a deploy, some requests still reach the previous version for a few
          # seconds, and a new custom domain needs a few minutes for its certificate, so
          # retry the whole set of checks (up to ~6 min) and name any failure.
          migrations="$(ls apps/worker/migrations/*.sql | wc -l)"
          check() {
            curl -fsS "$APP_URL/api/health" | jq -e --argjson m "$migrations" \
              '.ok == true and .migrations == $m and (.modules | length) >= 1' > /dev/null || { echo "health"; return 1; }
            curl -fsS "$APP_URL/" | grep -q '<div id="app">' || { echo "web app"; return 1; }
            curl -fsS "$APP_URL/auth/get-session" > /dev/null || { echo "auth session endpoint"; return 1; }
            curl -fsS "$APP_URL/.well-known/oauth-authorization-server" | jq -e '.issuer | endswith("/auth")' > /dev/null \
              || { echo "OAuth discovery"; return 1; }
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/api/me")" = "401" ] || { echo "/api/me not protected"; return 1; }
          }
          for i in $(seq 1 72); do
            if failed="$(check 2>&1)"; then
              curl -fsS "$APP_URL/api/health"; echo
              echo "App, API and auth are up at $APP_URL"
              exit 0
            fi
            echo "Attempt $i: waiting on: $failed"
            sleep 5
          done
          echo "Smoke test failed: $failed"
          exit 1
