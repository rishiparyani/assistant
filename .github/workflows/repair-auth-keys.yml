# Repair auth keys: after the auth secret changed (a rotation, or 2026-10-24's accidental one),
# the sign-in library's JWT signing key (the `jwks` row, encrypted under the old secret) can't be
# read, and anything that signs a token for an MCP connector fails. This removes the row; the
# library makes a new key under the current secret on its next use. Nobody's lists or records
# are touched. Connectors (Claude) sign in again; people sign in again anyway after a rotation.
#
# Public repo rules (docs/security.md): workflow_dispatch only, minimal permissions, actions
# pinned to SHAs, never print secrets or data.
name: Repair auth keys

on:
  workflow_dispatch:
    inputs:
      where:
        description: "Which app"
        type: choice
        options: [dev, production]
        default: dev

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.where }}
    concurrency:
      group: deploy-${{ inputs.where }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: ${{ inputs.where == 'production' && 'production' || '' }}
      DB_NAME: ${{ inputs.where == 'production' && 'assistant' || 'assistant-dev' }}
      DB_PLACEHOLDER: ${{ inputs.where == 'production' && '00000000-0000-0000-0000-000000000001' || '00000000-0000-0000-0000-000000000000' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Remove the unreadable signing key
        working-directory: apps/worker
        run: |
          id="$(pnpm exec wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')"
          test -n "$id"
          sed -i "s/$DB_PLACEHOLDER/$id/" wrangler.jsonc
          before="$(pnpm exec wrangler d1 execute "$DB_NAME" --remote ${CLOUDFLARE_ENV:+--env "$CLOUDFLARE_ENV"} --json --command "select count(*) as n from jwks" | jq -r '.[0].results[0].n')"
          pnpm exec wrangler d1 execute "$DB_NAME" --remote ${CLOUDFLARE_ENV:+--env "$CLOUDFLARE_ENV"} --command "delete from jwks" > /dev/null
          echo "Removed $before signing key(s); a new one is made on the next use."
