# The iPhone app (docs/design/ios-app.md), on GitHub's Mac runners (free for public repos).
# - simulator: every PR that touches the app (or run by hand). Builds it for the simulator,
#   runs a local Worker with fake data, and saves screenshots (light and dark) as an
#   artifact. No secrets.
# - testflight: push to main (or run by hand). Signs with the App Store Connect API key and
#   uploads to TestFlight (internal testing only). Skipped until the owner has added the
#   Apple secrets (docs/setup.md). Public repo rules: secrets only on push/dispatch, never
#   printed; the key file lives in the runner's temp folder and is deleted at the end.
name: iOS

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - "apps/web/**"
      - ".github/workflows/ios.yml"
  push:
    paths:
      - "apps/ios/**"
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail, so `xcodebuild … | tail` fails when xcodebuild fails.
defaults:
  run:
    shell: bash

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          xcodebuild -version

      - name: Start the local test server (fake data only)
        run: |
          cp apps/worker/.dev.vars.example apps/worker/.dev.vars
          nohup pnpm dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8787/api/health > /dev/null && exit 0; sleep 2; done
          tail -50 "$RUNNER_TEMP/dev.log"; exit 1

      - name: Seed fake data
        run: |
          node apps/ios/test/seed.mjs > "$RUNNER_TEMP/seed.txt"
          grep -q '^gig=' "$RUNNER_TEMP/seed.txt"

      - name: Pick simulators
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          runtimes = json.load(open(sys.argv[1]))["devices"]
          ios = sorted((k for k in runtimes if "iOS" in k), key=lambda k: [int(x) for x in re.findall(r"\d+", k)])
          devices = runtimes[ios[-1]]
          def pick(pattern):
              found = [d for d in devices if re.fullmatch(pattern, d["name"])]
              return found[-1]["udid"] if found else ""
          print("PHONE=" + (pick(r"iPhone \d+ Pro") or pick(r"iPhone.*")))
          print("SMALL=" + pick(r"iPhone SE.*|iPhone \d+e|iPhone 1[3-6] mini"))
          PY
          grep -E '^(PHONE|SMALL)=' "$GITHUB_ENV"

      # Swift packages (Capacitor) and compiled parts from earlier runs: ~1 min builds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dd
          key: ios-dd-${{ hashFiles('apps/ios/ios/App/CapApp-SPM/Package.swift', 'apps/ios/ios/App/App.xcodeproj/project.pbxproj') }}
          restore-keys: ios-dd-

      - name: Build for the simulator
        timeout-minutes: 15
        run: |
          cd apps/ios
          APP_ENV=local pnpm exec cap sync ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$PHONE" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { grep -E "error:|BUILD FAILED" -A3 "$RUNNER_TEMP/build.log" | head -60; exit 1; }
          tail -3 "$RUNNER_TEMP/build.log"

      # Each shot takes ~20-45 s on the runner: the full set on the large iPhone, a few on the
      # small one (light only), so the step stays well inside its limit.
      - name: Screenshots (light and dark)
        timeout-minutes: 25
        run: |
          set -e
          APP="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          COOKIE="$(sed -n 's/^cookie=//p' "$RUNNER_TEMP/seed.txt")"
          OUT="$RUNNER_TEMP/screens"; mkdir -p "$OUT"
          shoot() { # device label path name [signed-in]
            xcrun simctl terminate "$1" in.gigspree.assistant 2>/dev/null || true
            if [ "$5" = "out" ]; then
              xcrun simctl launch "$1" in.gigspree.assistant -testPath "$3" > /dev/null
            else
              xcrun simctl launch "$1" in.gigspree.assistant -testCookie "$COOKIE" -testPath "$3" > /dev/null
            fi
            sleep 5
            xcrun simctl io "$1" screenshot "$OUT/$2-$4.png" > /dev/null
          }
          for dev in "$PHONE" "$SMALL"; do
            [ -n "$dev" ] || continue
            label=$([ "$dev" = "$PHONE" ] && echo phone || echo small)
            xcrun simctl boot "$dev" 2>/dev/null || true
            xcrun simctl bootstatus "$dev" -b > /dev/null
            xcrun simctl status_bar "$dev" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$dev" "$APP"
            modes="light dark"; [ "$label" = small ] && modes="light"
            for mode in $modes; do
              xcrun simctl ui "$dev" appearance "$mode"
              # Signed out first (the session cookie stays in the app after the next launch).
              [ "$mode" = light ] && shoot "$dev" "$label-$mode" "/login" "0-login" out
              shoot "$dev" "$label-$mode" "/" "1-chat"
              [ "$label" = small ] && continue
              shoot "$dev" "$label-$mode" "/help" "2-help"
              shoot "$dev" "$label-$mode" "/shared" "3-shared"
              shoot "$dev" "$label-$mode" "/settings" "4-settings"
            done
            xcrun simctl shutdown "$dev"
          done
          ls "$OUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-screens
          path: ${{ runner.temp }}/screens
          retention-days: 14

      - name: Server log (on failure)
        if: failure()
        run: tail -80 "$RUNNER_TEMP/dev.log" | grep -v -i "cookie\|token" || true

  testflight:
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Apple secrets present?
        id: ready
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple secrets not set yet (docs/setup.md): skipping TestFlight."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ok
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ready.outputs.ok
        with:
          node-version-file: .nvmrc

      # Each fresh runner makes a new Apple Development certificate and Apple caps how many
      # an account may have. Note the ones that exist now, so the step after the build revokes
      # only the one this build made (scripts/apple-dev-certs.mjs).
      - name: Note development certificates before the build
        if: steps.ready.outputs.ok
        # Housekeeping: a problem here must never stop the build.
        continue-on-error: true
        run: node scripts/apple-dev-certs.mjs before "$RUNNER_TEMP/certs-before.json"

      - name: Build and upload to TestFlight
        if: steps.ready.outputs.ok
        run: |
          set -e
          corepack enable
          pnpm install --frozen-lockfile
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Build numbers only go up: this workflow's run number, plus room for earlier builds.
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          cd apps/ios
          APP_ENV=production pnpm exec cap sync ios
          plutil -insert teamID -string "$APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            "${AUTH[@]}" archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E "error:|ARCHIVE FAILED" -A3 "$RUNNER_TEMP/archive.log" | head -60; exit 1; }
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -iE "error" -A3 "$RUNNER_TEMP/export.log" | head -60; exit 1; }
          echo "Uploaded build $BUILD to TestFlight."

      - name: Revoke the development certificate this build made
        if: always() && steps.ready.outputs.ok
        continue-on-error: true
        run: node scripts/apple-dev-certs.mjs after "$RUNNER_TEMP/certs-before.json"
