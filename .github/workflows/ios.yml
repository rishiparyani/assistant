# The iPhone app (apps/mobile, Expo; docs/design/home-first.md), on GitHub's Mac runners (free
# for public repos).
# - simulator: every PR that touches the app (or run by hand). `expo prebuild` makes the Xcode
#   project, the app is built for the simulator with the JS bundled in (Release, so no Metro),
#   a local Worker runs with fake data, and screenshots (light and dark, two phone sizes) are
#   saved as an artifact. No secrets.
# - testflight: push to main (or run by hand). Signs with the App Store Connect API key and
#   uploads to TestFlight (internal testing only). Skipped until the owner has added the
#   Apple secrets (docs/setup.md). Public repo rules: secrets only on push/dispatch, never
#   printed; the key file lives in the runner's temp folder and is deleted at the end.
name: iOS

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/cards/**"
      - ".github/workflows/ios.yml"
  push:
    paths:
      - "apps/mobile/**"
      - "packages/shared/**"
      - "packages/cards/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

# bash with pipefail, so `xcodebuild … | tail` fails when xcodebuild fails.
defaults:
  run:
    shell: bash

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: in.gigspree.assistant

jobs:
  simulator:
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          xcodebuild -version

      - name: Start the local test server (fake data only)
        run: |
          cp apps/worker/.dev.vars.example apps/worker/.dev.vars
          nohup pnpm dev > "$RUNNER_TEMP/dev.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://localhost:8787/api/health > /dev/null && exit 0; sleep 2; done
          tail -50 "$RUNNER_TEMP/dev.log"; exit 1

      - name: Seed fake data
        run: |
          node apps/mobile/test/seed.mjs > "$RUNNER_TEMP/seed.txt"
          grep -q '^email=' "$RUNNER_TEMP/seed.txt"

      - name: Pick simulators
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - "$RUNNER_TEMP/devices.json" >> "$GITHUB_ENV" <<'PY'
          import json, re, sys
          runtimes = json.load(open(sys.argv[1]))["devices"]
          ios = sorted((k for k in runtimes if "iOS" in k), key=lambda k: [int(x) for x in re.findall(r"\d+", k)])
          devices = runtimes[ios[-1]]
          def pick(pattern):
              found = [d for d in devices if re.fullmatch(pattern, d["name"])]
              return found[-1]["udid"] if found else ""
          print("PHONE=" + (pick(r"iPhone \d+ Pro") or pick(r"iPhone.*")))
          print("SMALL=" + pick(r"iPhone SE.*|iPhone \d+e|iPhone 1[3-6] mini"))
          PY
          grep -E '^(PHONE|SMALL)=' "$GITHUB_ENV"

      # The native project is generated, not committed (apps/mobile/ios is git-ignored).
      - name: Make the Xcode project
        run: |
          cd apps/mobile
          npx expo prebuild --platform ios --no-install
          test -f ios/Podfile

      # The JS bundle on its own first (what Xcode's bundle phase runs, ~1 min): a Metro problem
      # shows here with its full message instead of at the end of a 15-minute native build.
      - name: Bundle the JS (same as Xcode's bundle phase)
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8787
          CI: 1
        run: |
          cd apps/mobile
          npx expo export:embed --platform ios --dev false --reset-cache \
            --entry-file "$(node -e "require('expo/scripts/resolveAppEntry')" . ios absolute | tail -n 1)" \
            --bundle-output "$RUNNER_TEMP/check.jsbundle" --assets-dest "$RUNNER_TEMP/check-assets" 2>&1 | tail -20
          ls -la "$RUNNER_TEMP/check.jsbundle"

      # Pods and compiled parts from earlier runs: a few minutes saved per build. Saved even
      # when the build fails, so a second try is cheaper.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: |
            apps/mobile/ios/Pods
            ${{ runner.temp }}/dd
          key: expo-ios-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          restore-keys: expo-ios-

      - name: Build for the simulator
        timeout-minutes: 30
        env:
          # Baked into the JS at build time (Release bundles it in): the local test server.
          EXPO_PUBLIC_API_URL: http://localhost:8787
          CI: 1
        run: |
          cd apps/mobile/ios
          pod install > "$RUNNER_TEMP/pods.log" 2>&1 || { tail -40 "$RUNNER_TEMP/pods.log"; exit 1; }
          # Ad-hoc signed (not unsigned): the Keychain refuses an app without entitlements, and
          # the session cookie lives there.
          xcodebuild -workspace Gigspree.xcworkspace -scheme Gigspree -configuration Release \
            -destination "platform=iOS Simulator,id=$PHONE" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build > "$RUNNER_TEMP/build.log" 2>&1 \
            || { echo "--- bundle phase output ---"; \
                 awk '/PhaseScriptExecution.*Bundle/{p=1} p && !/^ *export /{print}' "$RUNNER_TEMP/build.log" | head -150; \
                 echo "--- errors ---"; grep -E "^.*error:" "$RUNNER_TEMP/build.log" | grep -v "export " | head -20; exit 1; }
          tail -3 "$RUNNER_TEMP/build.log"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            apps/mobile/ios/Pods
            ${{ runner.temp }}/dd
          key: expo-ios-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}

      # Each shot takes ~20-45 s on the runner: the full set on the large iPhone, a few on the
      # small one (light only). The app signs in through its /test route (localhost only).
      - name: Screenshots (light and dark)
        timeout-minutes: 25
        run: |
          set -e
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphonesimulator/Gigspree.app"
          EMAIL="$(sed -n 's/^email=//p' "$RUNNER_TEMP/seed.txt")"
          PASSWORD="$(sed -n 's/^password=//p' "$RUNNER_TEMP/seed.txt")"
          OUT="$RUNNER_TEMP/screens"; mkdir -p "$OUT"
          # `simctl openurl` with the app's scheme asks "Open in Gigspree?" on recent iOS, which
          # nothing here can tap; the app is launched with the test sign-in as launch arguments
          # instead (read by the home against the local test server only, see app/test.tsx).
          go() {
            xcrun simctl terminate "$1" "$BUNDLE_ID" 2>/dev/null || true
            # A fourth argument shows the first-run tour (it stays off for the other shots).
            xcrun simctl launch "$1" "$BUNDLE_ID" -testEmail "$EMAIL" -testPassword "$PASSWORD" -testPath "$2" ${4:+-testTour 1} > /dev/null
            sleep "${3:-14}"
          }
          shot() { xcrun simctl io "$1" screenshot "$OUT/$2.png" > /dev/null; }
          for dev in "$PHONE" "$SMALL"; do
            [ -n "$dev" ] || continue
            label=$([ "$dev" = "$PHONE" ] && echo phone || echo small)
            xcrun simctl boot "$dev" 2>/dev/null || true
            xcrun simctl bootstatus "$dev" -b > /dev/null
            xcrun simctl status_bar "$dev" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$dev" "$APP"
            # Signed out first: a fresh install has no session.
            xcrun simctl ui "$dev" appearance light
            xcrun simctl launch "$dev" "$BUNDLE_ID" > /dev/null; sleep 6
            shot "$dev" "$label-light-0-login"
            # The first signed-in launch of a fresh install is slow on the runner: more time.
            go "$dev" "/" 24
            shot "$dev" "$label-light-1-home"
            [ "$label" = small ] && { xcrun simctl shutdown "$dev"; continue; }
            go "$dev" "/chat"
            shot "$dev" "$label-light-2-chat"
            # The chat with a message started: the keyboard is up, the message box must clear it.
            go "$dev" "/chat?ask=Spent 450 on chai"
            shot "$dev" "$label-light-3-chat-typing"
            go "$dev" "/memory"
            shot "$dev" "$label-light-4-memory"
            # What "Add to Gigspree" (Siri) lands on: the capture screen against the test server.
            go "$dev" "/capture?text=Strings%20450%20at%20Furtados"
            shot "$dev" "$label-light-5-capture"
            # Every kind of card at every size (made-up data, packages/cards).
            go "$dev" "/gallery" 8
            shot "$dev" "$label-light-6-gallery"
            # The first-run tour's first step over the home (late in the run: the app is warm and
            # the home loads within the wait).
            go "$dev" "/" 20 tour
            shot "$dev" "$label-light-7-tour"
            xcrun simctl terminate "$dev" "$BUNDLE_ID" || true
            xcrun simctl ui "$dev" appearance dark
            go "$dev" "/"
            shot "$dev" "$label-dark-1-home"
            go "$dev" "/chat"
            shot "$dev" "$label-dark-2-chat"
            go "$dev" "/gallery" 8
            shot "$dev" "$label-dark-6-gallery"
            # What the app and the server said (no secrets: fake data, cookies and tokens cut).
            echo "::group::app log"
            xcrun simctl spawn "$dev" log show --last 12m --style compact \
              --predicate 'processImagePath CONTAINS "Gigspree"' 2>/dev/null | grep -v -i "cookie\|token" | tail -150 || true
            echo "::endgroup::"
            xcrun simctl shutdown "$dev"
          done
          echo "::group::server log"
          tail -60 "$RUNNER_TEMP/dev.log" | grep -v -i "cookie\|token" || true
          echo "::endgroup::"
          ls "$OUT"

      # Agent sessions can't download artifacts, so the large phone's shots also go in the log
      # as small JPEGs (base64): copy the lines between the markers and decode them.
      - name: Screenshots in the log
        if: always()
        run: |
          for f in "$RUNNER_TEMP"/screens/phone-*.png; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .png)
            sips -Z 720 -s format jpeg -s formatOptions 55 "$f" --out "$RUNNER_TEMP/$n.jpg" > /dev/null
            echo "::group::$n"
            echo "-----BEGIN $n-----"
            base64 -b 76 -i "$RUNNER_TEMP/$n.jpg"
            echo "-----END $n-----"
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-screens
          path: ${{ runner.temp }}/screens
          retention-days: 14

      - name: Logs (on failure)
        if: failure()
        run: |
          tail -40 "$RUNNER_TEMP/dev.log" | grep -v -i "cookie\|token" || true
          xcrun simctl spawn "$PHONE" log show --last 3m --predicate 'process == "Gigspree"' 2>/dev/null | tail -60 || true
      # Build and pod logs (no secrets in this job) for reading the failure in full.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ios-build-logs
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/pods.log
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Apple secrets present?
        id: ready
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "Apple secrets not set yet (docs/setup.md): skipping TestFlight."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ok
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.ready.outputs.ok
        with:
          node-version-file: .nvmrc

      # Each fresh runner makes a new Apple Development certificate and Apple caps how many
      # an account may have. Note the ones that exist now, so the step after the build revokes
      # only the one this build made (scripts/apple-dev-certs.mjs).
      - name: Note development certificates before the build
        if: steps.ready.outputs.ok
        # Housekeeping: a problem here must never stop the build.
        continue-on-error: true
        run: node scripts/apple-dev-certs.mjs before "$RUNNER_TEMP/certs-before.json"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.ready.outputs.ok
        with:
          path: apps/mobile/ios/Pods
          key: expo-pods-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.json') }}
          restore-keys: expo-pods-

      - name: Build and upload to TestFlight
        if: steps.ready.outputs.ok
        env:
          # The real app talks to the real server, and signs in with Google through the system
          # sheet (owner's standing OK, decisions.md 2026-10-11).
          EXPO_PUBLIC_API_URL: https://gigspree.in
          EXPO_PUBLIC_GOOGLE_IN_APP: 1
          CI: 1
        run: |
          set -e
          corepack enable
          pnpm install --frozen-lockfile
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          trap 'rm -f "$KEY"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Build numbers only go up: this workflow's run number, plus room for earlier builds.
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          cd apps/mobile
          # The build number goes into Info.plist at prebuild (app.config.js), not on the
          # xcodebuild command line: Expo writes it as a literal.
          BUILD_NUMBER="$BUILD" npx expo prebuild --platform ios --no-install
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          cd ios
          pod install > "$RUNNER_TEMP/pods.log" 2>&1 || { tail -40 "$RUNNER_TEMP/pods.log"; exit 1; }
          xcodebuild -workspace Gigspree.xcworkspace -scheme Gigspree -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            "${AUTH[@]}" archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -iE "error|failed" -B8 -A3 "$RUNNER_TEMP/archive.log" | tail -120; exit 1; }
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" > "$RUNNER_TEMP/export.log" 2>&1 \
            || { grep -iE "error" -A3 "$RUNNER_TEMP/export.log" | head -60; exit 1; }
          echo "Uploaded build $BUILD to TestFlight."

      - name: Revoke the development certificate this build made
        if: always() && steps.ready.outputs.ok
        continue-on-error: true
        run: node scripts/apple-dev-certs.mjs after "$RUNNER_TEMP/certs-before.json"
