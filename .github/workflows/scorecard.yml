# The model scorecard (apps/worker/scorecard): real requests through the whole app on fake
# data, with only the AI calls going to Workers AI on the owner's account. Started by hand
# (or by an agent through the API); prints the scorecard table, which an agent copies into
# docs/scorecard/. The free model uses the daily allowance (about 2,000 neurons for the core
# 23, ~5,000 for all 54, shared with the real app);
# setups run only when a paid gateway is named, and then spend prepaid credit within the cap.
name: Scorecard

on:
  workflow_dispatch:
    inputs:
      paid_gateway:
        description: "Unified-billing gateway id for the smart model (empty: everyday cases only)"
        required: false
        default: ""
      only:
        description: "Comma-separated case ids to run (empty: all)"
        required: false
        default: ""
      suite:
        description: "Which cases: core (everyday), hard (the harder everyday ones), setups (level 2 only) or all"
        required: false
        default: "all"
        type: choice
        options: [all, core, hard, setups]
      repeat:
        description: "Runs of each case (1-5), to see how steady a model is"
        required: false
        default: "1"
      model:
        description: "Everyday model to try instead of the current one (an id from core/assistant/models.ts, e.g. gpt-oss-120b, claude-haiku-5-5, gpt-5.4-nano, gemini-3.1-flash-lite; empty: current)"
        required: false
        default: ""
      setup_model:
        description: "Setups model to try (level 2; an id from models.ts, e.g. claude-sonnet-5-5, gpt-5.4, gemini-3.1-pro-preview, gemini-3.6-flash; @cf/moonshotai/kimi-k2.6 needs paid_gateway; empty: the current one, needs paid_gateway)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scorecard
  cancel-in-progress: false

jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run the scorecard
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_PAID_GATEWAY: ${{ inputs.paid_gateway }}
          SCORECARD_ONLY: ${{ inputs.only }}
          SCORECARD_SUITE: ${{ inputs.suite }}
          SCORECARD_REPEAT: ${{ inputs.repeat }}
          AI_EVERYDAY_MODEL: ${{ inputs.model }}
          AI_SETUP_MODEL: ${{ inputs.setup_model }}
          # Faster answers (Cerebras); only used when the model input names gpt-oss-120b.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # The makers' keys; each only used when the model input names one of its models.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Only the table and per-case lines are printed (fake data); the token stays in env.
        run: |
          set -o pipefail
          pnpm exec vitest run -c vitest.scorecard.config.ts --silent=false --reporter=verbose 2>&1 | tee scorecard.log
          sed -n '/=== SCORECARD ===/,/=== END ===/p' scorecard.log | sed '1d;$d' >> "$GITHUB_STEP_SUMMARY"
